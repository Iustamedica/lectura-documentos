[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documental"
version = "0.4.0"
description = "Lector local de documentos judiciales (OCR): perfiles legal y salud, con revision editable e informe Word."
authors = [{ name = "Iustamedica (desarrollo en colaboracion con DeepSeek)" }]
requires-python = ">=3.10"
dependencies = [
    "pymupdf==2.0",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.0",
    "pillow==13.0.0",
    "python-docx==1.2.0",
]

[project.scripts]
documental = "documental.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
